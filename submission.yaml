submission:
  title: "Enterprise Power Outage Prediction & Grid Equipment Failure Advisor"                            # REQUIRED — Project display name, e.g., "SmartOps Dashboard"

  problem_statement: >                 # REQUIRED — 1-3 sentences. What problem? Who has it?
  
    Power utilities face unexpected power outages and equipment failures
    because equipment sensor data, weather conditions, and historical incident
    records are not analyzed together. This makes it difficult for grid
    operators to identify risky equipment and plan timely maintenance and
    crew deployment.
    
  solution_summary: >                  # REQUIRED — 1-3 sentences. What did you build?
  
    We built an end-to-end telemetry risk analytics engine and interactive GIS dashboard that predicts transformer failures
    using IoT telemetry (oil temp, gas PPM, vibration) and environmental factors. The solution integrates an exploratory
    data analysis pipeline with real-time location geocoding to prioritize critical assets and automate maintenance crew 
    dispatch directives.
    
  key_features:                        # REQUIRED — List 3 to 5 specific features you implemented
    - "Automated synthetic IoT telemetry generation and model training pipeline (train.py)"
    - "Exploratory Data Analysis (EDA) engine for substation-wise risk breakdown and impact analytics (eda_analysis.py)"
    - "Interactive Streamlit Web Dashboard featuring dynamic location geocoding via OpenStreetMap API"
    - "Real-time GIS risk visualization with color-coded asset severity indicators on Folium maps"
    - "Automated Priority Crew Dispatch planner based on estimated customer outage severity"                              # e.g., "Real-time pipeline anomaly detection using watsonx.ai"
                                  

  tech_stack:
    languages: ["Python"]                      # REQUIRED — e.g., ["Python", "TypeScript"]
    frameworks: ["Streamlit"]                     # e.g., ["FastAPI", "React"]
    ibm_technologies: ["IBM Predictive Analytics Concepts"]               # e.g., ["watsonx.ai", "IBM Bob", "IBM Cloud Functions"]
    databases: ["CSV File System", "Pandas Flat-File Storage"]                      # e.g., ["PostgreSQL", "Redis"]
    other: ["Pandas", "NumPy", "Joblib", "Folium", "OpenStreetMap API"]                          # e.g., ["Docker", "GitHub Actions", "Slack API"]

  what_we_are_most_proud_of: >         # Optional but recommended — guides judges to your best work
  
   We are most proud of building a fully responsive, end-to-end operational pipeline that seamlessly connects low-level telemetry
   risk calculation with live OpenStreetMap geocoding,allowing grid operators to search any real-world location and instantly view
   priority crew dispatch advisories.

  known_limitations: >                 # Optional but recommended — be honest about gaps
    Currently relies on synthetic telemetry generation and deterministic fallback rules due to system-level execution constraints, 
    and external Nominatim API rate limits may occasionally cause map re-rendering fallbacks.

